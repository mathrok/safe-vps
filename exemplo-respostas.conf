# Exemplo de arquivo de respostas para o safe-vps.
# Use assim (não faz nenhuma pergunta):
#   sudo bash safe-vps.sh --respostas exemplo-respostas.conf --conferir
# Cada linha é NOME="valor". O README.md explica cada uma.

# Sua conta de administrador (minúsculas, sem espaços).
ADMIN_USER="admin"
# Sua chave PÚBLICA SSH (linha do arquivo .pub). Vazio = usar as que já existem.
SSH_KEY=""
# Nome do servidor. Vazio = manter o atual.
NEW_HOSTNAME=""
TIMEZONE="America/Sao_Paulo"
SSH_PORT="22"
# sim = permite túnel SSH (painéis só pelo seu computador); nao = desliga.
SSH_TUNNEL="sim"
# Portas abertas para a internet, além do SSH. Vazio = nenhuma.
PUBLIC_PORTS="80/tcp 443/tcp 443/udp"
UPGRADE_NOW="sim"
# nao, ou um horário HH:MM para reiniciar sozinho quando preciso.
AUTO_REBOOT="nao"
# Tamanho da swap (0 = nenhuma).
SWAP_SIZE="2G"
INSTALL_DOCKER="sim"
DOCKER_GROUP="sim"
RUN_LYNIS="sim"
FAIL2BAN_MAXRETRY="5"
FAIL2BAN_BANTIME="1h"
JOURNAL_MAX="500M"
ROLLBACK_MINUTES="10"
